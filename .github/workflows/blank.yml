
name: Build AURA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          unzip -q aura_phase11.zip -d work
          test -d work/aura

      - name: Prepare Android
        working-directory: work/aura
        run: |
          flutter create --platforms=android --org com.aura .
          grep -q AuraApp lib/main.dart || { echo "App entry point not found"; exit 1; }

          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
          """
          if 'BLUETOOTH_SCAN' not in s:
              s = s.replace('<application', perms + '\n    <application', 1)
          open(p, 'w', encoding='utf-8').write(s)

          p = 'lib/core/theme.dart'
          s = open(p, encoding='utf-8').read()
          imp = "import 'package:flutter/cupertino.dart';"
          if imp not in s:
              s = imp + "\n" + s
          open(p, 'w', encoding='utf-8').write(s)
          PY

          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true

      - name: Add missing packages
        working-directory: work/aura
        run: |
          flutter pub add sqflite
          flutter pub add bluetooth_low_energy
          flutter pub add cryptography
          flutter pub add flutter_secure_storage
          flutter pub add file_picker
          flutter pub add path_provider
          flutter pub add video_player

      - name: Configure Firebase
        working-directory: work/aura
        run: |
          sed -i "s|PUT_API_KEY|${{ secrets.FIREBASE_API_KEY }}|; s|PUT_APP_ID|${{ secrets.FIREBASE_APP_ID }}|; s|PUT_SENDER_ID|${{ secrets.FIREBASE_SENDER_ID }}|; s|PUT_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|" lib/firebase_options.dart

      - name: Prepare signing key
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Get packages
        working-directory: work/aura
        run: flutter pub get

      - name: Analyze project
        working-directory: work/aura
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        working-directory: work/aura
        run: flutter build apk --release
              - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-apk
          path: work/aura/build/app/outputs/flutter-apk/app-release.apk
        
